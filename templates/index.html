<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Railway Help Desk</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background: linear-gradient(135deg, #e8ebed 0%, #d4dce3 50%, #c5cfd8 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #17191C;
            text-shadow: 2px 2px 4px rgba(146, 157, 167, 0.3);
            letter-spacing: 1px;
        }

        .header p {
            color: #929DA7;
            font-size: 1.1em;
        }

        .question-box {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(23, 25, 28, 0.15);
            border: 3px solid #929DA7;
            margin-bottom: 30px;
        }

        .input-wrapper {
            margin-bottom: 20px;
        }

        #questionInput {
            width: 100%;
            padding: 15px;
            font-size: 1.1em;
            border: 2px solid #929DA7;
            border-radius: 8px;
            font-family: 'Segoe UI', Arial, sans-serif;
            transition: border-color 0.3s;
            background: #f5f7f9;
        }

        #questionInput:focus {
            outline: none;
            border-color: #17191C;
            box-shadow: 0 0 15px rgba(146, 157, 167, 0.4);
            background: white;
        }

        .btn-ask {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #17191C 0%, #2a2d31 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
        }

        .btn-ask:hover:not(:disabled) {
            background: linear-gradient(135deg, #2a2d31 0%, #17191C 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(146, 157, 167, 0.5);
        }

        .btn-ask:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .examples {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }

        .examples-title {
            color: #17191C;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 0.95em;
        }

        .example-btn {
            display: inline-block;
            padding: 8px 15px;
            margin: 5px;
            background: #f5f7f9;
            border: 2px solid #929DA7;
            border-radius: 20px;
            color: #17191C;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .example-btn:hover {
            background: #929DA7;
            color: white;
            border-color: #929DA7;
            transform: translateY(-1px);
        }

        .loading {
            display: none;
            text-align: center;
            padding: 30px;
            background: white;
            border-radius: 15px;
            border: 3px solid #929DA7;
            box-shadow: 0 10px 30px rgba(146, 157, 167, 0.2);
        }

        .spinner {
            border: 4px solid #e8ebed;
            border-top: 4px solid #17191C;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #17191C;
            font-weight: bold;
            font-size: 1.1em;
        }

        .error-box {
            display: none;
            background: #fee;
            border: 3px solid #dc3545;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            color: #721c24;
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.15);
        }

        .result-box {
            display: none;
            background: white;
            border-radius: 15px;
            padding: 30px;
            border: 3px solid #929DA7;
            box-shadow: 0 10px 30px rgba(146, 157, 167, 0.2);
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .answer-section {
            margin-bottom: 25px;
            padding-bottom: 25px;
            border-bottom: 2px solid #e8ebed;
        }

        .section-title {
            color: #17191C;
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .answer-text {
            color: #333;
            line-height: 1.8;
            font-size: 1.05em;
            margin-bottom: 15px;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 0.9em;
        }

        .status-answered {
            background: linear-gradient(135deg, #4caf50 0%, #388e3c 100%);
            color: white;
        }

        .status-dont-know {
            background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
            color: white;
        }

        .sources-section, .sql-section {
            margin-bottom: 25px;
        }

        .source-item {
            background: #f5f7f9;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border-left: 4px solid #929DA7;
            color: #17191C;
        }

        .sql-code {
            background: #17191C;
            color: #e8ebed;
            padding: 20px;
            border-radius: 10px;
            overflow-x: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.95em;
            line-height: 1.6;
            border: 2px solid #929DA7;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }

            .question-box, .result-box {
                padding: 20px;
            }

            .example-btn {
                display: block;
                margin: 5px 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚂 RAILWAY HELP DESK</h1>
            <p>Ask about Indian Railways rules and timetables</p>
        </div>

        <div class="question-box">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="questionInput" 
                    placeholder="Type your question here..."
                    onkeypress="handleKeyPress(event)"
                >
            </div>
            
            <button class="btn-ask" onclick="askQuestion()" id="askBtn">
                ASK QUESTION
            </button>

            <div class="examples">
                <div class="examples-title">📋 Example Questions:</div>
                <button class="example-btn" onclick="setQuestion('What is Rule 25?')">What is Rule 25?</button>
                <button class="example-btn" onclick="setQuestion('What is the cancellation charge for AC First Class?')">AC First Class cancellation</button>
                <button class="example-btn" onclick="setQuestion('Which trains run from Delhi to Mumbai?')">Delhi to Mumbai trains</button>
                <button class="example-btn" onclick="setQuestion('What is the name of train 12430?')">Train 12430 info</button>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p class="loading-text">Processing your question...</p>
        </div>

        <div class="error-box" id="errorBox"></div>

        <div class="result-box" id="resultBox">
            <div class="answer-section">
                <div class="section-title">📝 Answer</div>
                <div class="answer-text" id="answerText"></div>
                <div id="statusBadge"></div>
            </div>

            <div class="sources-section" id="sourcesSection" style="display: none;">
                <div class="section-title">📚 Sources</div>
                <div id="sourcesList"></div>
            </div>

            <div class="sql-section" id="sqlSection" style="display: none;">
                <div class="section-title">🔍 SQL Query</div>
                <pre class="sql-code" id="sqlCode"></pre>
            </div>
        </div>
    </div>

    <script>
        function setQuestion(question) {
            document.getElementById('questionInput').value = question;
            document.getElementById('questionInput').focus();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                askQuestion();
            }
        }

        async function askQuestion() {
            const question = document.getElementById('questionInput').value.trim();
            
            if (!question) {
                showError('Please enter a question');
                return;
            }

            // Show loading, hide results and errors
            document.getElementById('loading').style.display = 'block';
            document.getElementById('resultBox').style.display = 'none';
            document.getElementById('errorBox').style.display = 'none';
            document.getElementById('askBtn').disabled = true;

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ question })
                });

                const result = await response.json();

                if (result.success) {
                    displayResult(result.data);
                } else {
                    showError(result.error || 'An error occurred');
                }
            } catch (error) {
                showError('Network error: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('askBtn').disabled = false;
            }
        }

        function displayResult(data) {
            // Show answer
            document.getElementById('answerText').textContent = data.answer;

            // Show status badge
            const statusBadge = document.getElementById('statusBadge');
            if (data.dont_know) {
                statusBadge.innerHTML = '<span class="status-badge status-dont-know">⚠️ I DON\'T KNOW</span>';
            } else {
                statusBadge.innerHTML = '<span class="status-badge status-answered">✅ ANSWERED</span>';
            }

            // Show sources
            const sourcesSection = document.getElementById('sourcesSection');
            const sourcesList = document.getElementById('sourcesList');
            
            if (data.sources && data.sources.length > 0) {
                sourcesSection.style.display = 'block';
                sourcesList.innerHTML = data.sources.map(source => {
                    const page = source.page !== null ? `Page ${source.page}` : 'Web page';
                    return `<div class="source-item">📄 ${source.doc} (${page})</div>`;
                }).join('');
            } else {
                sourcesSection.style.display = 'none';
            }

            // Show SQL
            const sqlSection = document.getElementById('sqlSection');
            const sqlCode = document.getElementById('sqlCode');
            
            if (data.sql) {
                sqlSection.style.display = 'block';
                sqlCode.textContent = data.sql;
            } else {
                sqlSection.style.display = 'none';
            }

            // Show result box
            document.getElementById('resultBox').style.display = 'block';
        }

        function showError(message) {
            const errorBox = document.getElementById('errorBox');
            errorBox.textContent = '❌ Error: ' + message;
            errorBox.style.display = 'block';
        }
    </script>
</body>
</html>
