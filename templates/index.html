<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Railway Help Desk</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .question-section {
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        #questionInput {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        #questionInput:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .examples {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .example-btn {
            padding: 8px 15px;
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .example-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .result-section {
            display: none;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .answer-box {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .answer-box h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .answer-box p {
            color: #555;
            line-height: 1.6;
            font-size: 1em;
        }

        .sources-box, .sql-box {
            background: #fff;
            border: 1px solid #e0e0e0;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .sources-box h4, .sql-box h4 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1em;
        }

        .source-item {
            background: #f8f9fa;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 5px;
            font-size: 0.9em;
        }

        .sql-code {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            line-height: 1.5;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
            margin-top: 10px;
        }

        .status-answered {
            background: #d4edda;
            color: #155724;
        }

        .status-dont-know {
            background: #fff3cd;
            color: #856404;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-box {
            background: #f8d7da;
            border-left: 4px solid #dc3545;
            padding: 15px;
            border-radius: 10px;
            color: #721c24;
            display: none;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .input-group {
                flex-direction: column;
            }

            .examples {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚂 Railway Help Desk</h1>
            <p>Ask questions about Indian Railways rules and timetables</p>
        </div>

        <div class="question-section">
            <div class="input-group">
                <input 
                    type="text" 
                    id="questionInput" 
                    placeholder="Ask your question here..."
                    onkeypress="handleKeyPress(event)"
                >
                <button class="btn btn-primary" onclick="askQuestion()" id="askBtn">
                    Ask Question
                </button>
            </div>

            <div class="examples">
                <p style="width: 100%; color: #666; margin-bottom: 5px; font-size: 0.9em;">Try these examples:</p>
                <button class="example-btn" onclick="setQuestion('What is Rule 25?')">What is Rule 25?</button>
                <button class="example-btn" onclick="setQuestion('What is the Tatkal cancellation charge?')">Tatkal cancellation</button>
                <button class="example-btn" onclick="setQuestion('Which trains run from Delhi to Mumbai?')">Delhi to Mumbai trains</button>
                <button class="example-btn" onclick="setQuestion('What is the advance reservation period?')">Advance reservation</button>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: #666;">Processing your question...</p>
        </div>

        <div class="error-box" id="errorBox"></div>

        <div class="result-section" id="resultSection">
            <div class="answer-box">
                <h3>📝 Answer</h3>
                <p id="answerText"></p>
                <div id="statusBadge"></div>
            </div>

            <div class="sources-box" id="sourcesBox" style="display: none;">
                <h4>📚 Sources</h4>
                <div id="sourcesList"></div>
            </div>

            <div class="sql-box" id="sqlBox" style="display: none;">
                <h4>🔍 SQL Query</h4>
                <pre class="sql-code" id="sqlCode"></pre>
            </div>
        </div>
    </div>

    <script>
        function setQuestion(question) {
            document.getElementById('questionInput').value = question;
            document.getElementById('questionInput').focus();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                askQuestion();
            }
        }

        async function askQuestion() {
            const question = document.getElementById('questionInput').value.trim();
            
            if (!question) {
                showError('Please enter a question');
                return;
            }

            // Show loading, hide results and errors
            document.getElementById('loading').style.display = 'block';
            document.getElementById('resultSection').style.display = 'none';
            document.getElementById('errorBox').style.display = 'none';
            document.getElementById('askBtn').disabled = true;

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ question })
                });

                const result = await response.json();

                if (result.success) {
                    displayResult(result.data);
                } else {
                    showError(result.error || 'An error occurred');
                }
            } catch (error) {
                showError('Network error: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('askBtn').disabled = false;
            }
        }

        function displayResult(data) {
            // Show answer
            document.getElementById('answerText').textContent = data.answer;

            // Show status badge
            const statusBadge = document.getElementById('statusBadge');
            if (data.dont_know) {
                statusBadge.innerHTML = '<span class="status-badge status-dont-know">⚠️ I don\'t know</span>';
            } else {
                statusBadge.innerHTML = '<span class="status-badge status-answered">✅ Answered</span>';
            }

            // Show sources
            const sourcesBox = document.getElementById('sourcesBox');
            const sourcesList = document.getElementById('sourcesList');
            
            if (data.sources && data.sources.length > 0) {
                sourcesBox.style.display = 'block';
                sourcesList.innerHTML = data.sources.map(source => {
                    const page = source.page !== null ? `Page ${source.page}` : 'Web page';
                    return `<div class="source-item">📄 ${source.doc} (${page})</div>`;
                }).join('');
            } else {
                sourcesBox.style.display = 'none';
            }

            // Show SQL
            const sqlBox = document.getElementById('sqlBox');
            const sqlCode = document.getElementById('sqlCode');
            
            if (data.sql) {
                sqlBox.style.display = 'block';
                sqlCode.textContent = data.sql;
            } else {
                sqlBox.style.display = 'none';
            }

            // Show result section
            document.getElementById('resultSection').style.display = 'block';
        }

        function showError(message) {
            const errorBox = document.getElementById('errorBox');
            errorBox.textContent = '❌ Error: ' + message;
            errorBox.style.display = 'block';
        }
    </script>
</body>
</html>
